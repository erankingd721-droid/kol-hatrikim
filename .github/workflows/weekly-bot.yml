name: Daily bot + site

on:
  # כל יום ב-00:00 UTC (02:00-03:00 לפנות בוקר בישראל)
  schedule:
    - cron: '0 0 * * *'
  # הרצה ידנית מלשונית Actions
  workflow_dispatch:
  # כל שינוי באתר עולה מיד
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bot:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Image tool for shrinking TikTok thumbnails
        run: command -v convert || (sudo apt-get update && sudo apt-get install -y imagemagick)
      - name: Scan YouTube Shorts and TikTok
        run: node bot/bot.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      - name: Save the new tricks
        run: |
          git config user.name "kol-hatrikim-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily tricks $(date -u +%Y-%m-%d)"
            git push
          fi

  deploy:
    needs: bot
    if: ${{ !cancelled() && (needs.bot.result == 'success' || needs.bot.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
